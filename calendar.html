<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendar | Aria Carmona</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <style>
    @font-face {
      font-family: 'Vogue';
      src: url('fonts/Vogue.ttf') format('truetype');
      font-display: swap;
    }

    :root{
      --bg: #050405;
      --panel: rgba(255,255,255,0.035);
      --line: rgba(255,255,255,0.09);
      --muted: #bdb8bf;
      --pink: #ff66cc;
      --pink-soft: rgba(255,102,204,0.18);
      --pink-dim: rgba(255,102,204,0.22);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Vogue", serif;
      background:var(--bg);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      line-height:1.35;
      overflow-x:hidden;
    }
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    :focus-visible{outline:2px solid var(--pink);outline-offset:3px}

    /* NAVBAR (shared look with news / gallery / contact) */
    .navbar{
      position:fixed;top:0;left:0;width:100%;z-index:1000;
      display:flex;justify-content:space-between;align-items:center;padding:18px 48px;
      background:linear-gradient(to bottom,rgba(0,0,0,.72),rgba(0,0,0,0));
    }
    .logo img{height:42px;width:auto;display:block}
    .nav-links{display:flex;gap:30px;align-items:center}
    .nav-links a{color:#fff;text-decoration:none;font-size:14px;letter-spacing:.12em;transition:color .25s}
    .nav-links a:hover,.nav-links a.active{color:var(--pink)}

    /* ================= TRACK VISUALISER ================= */
    .viz{
      min-height:100vh;
      padding:104px 28px 28px;
      display:flex; flex-direction:column; gap:18px;
      position:relative;
      background:
        radial-gradient(60% 55% at 70% 48%, rgba(255,102,204,0.11), transparent 70%),
        var(--bg);
    }
    .viz-head{
      display:flex; justify-content:space-between; align-items:flex-end;
      gap:20px; flex-wrap:wrap; max-width:1360px; width:100%; margin:0 auto;
    }
    .viz-head h1{font-size:clamp(28px,4.2vw,52px);font-weight:900;letter-spacing:0.01em;line-height:1}
    .viz-head p{color:var(--muted);font-size:15px;margin-top:10px;max-width:560px}
    .tabs{display:flex;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px}
    .tabs a{
      color:var(--muted);text-decoration:none;font-size:14px;
      padding:8px 16px;border-radius:999px;transition:all .18s ease;
    }
    .tabs a.on, .tabs a:hover{background:var(--pink);color:#000}

    .viz-main{
      flex:1; width:100%; max-width:1360px; margin:0 auto;
      display:grid; grid-template-columns:minmax(300px,400px) 1fr; gap:28px;
      align-items:stretch; min-height:520px;
    }

    /* details panel */
    .panel{
      border:1px solid var(--pink-soft); border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      padding:24px; display:flex; flex-direction:column; gap:16px;
      box-shadow:0 30px 60px rgba(0,0,0,0.55);
    }
    .p-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
    .p-status{
      font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
    }
    .p-status.up{border-color:var(--pink);color:var(--pink)}
    .p-date{display:flex;align-items:baseline;gap:12px;line-height:.9}
    .p-day{font-size:84px;color:var(--pink);font-weight:900}
    .p-month{font-size:30px}
    .p-year{font-size:16px;color:var(--muted);margin-left:auto}
    .p-title{font-size:22px;font-weight:900;line-height:1.15}
    .p-blurb{color:var(--muted);font-size:14px;line-height:1.55}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
    .stat .k{font-size:12px;color:var(--muted)}
    .stat .v{font-weight:800;color:var(--pink);font-size:14px;margin-top:5px;overflow-wrap:anywhere}
    .sched{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
    .sched h3{font-size:12px;color:var(--muted);font-weight:400}
    .sched-item{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13px}
    .sched-item span:last-child{color:var(--pink)}

    /* the outline stage */
    .stage{
      position:relative; border-radius:14px; overflow:hidden;
      border:1px solid var(--line);
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0/56px 56px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/56px 56px,
        rgba(255,255,255,0.012);
      min-height:460px;
    }
    .stage::before{ /* soften the grid toward the edges */
      content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
      background:radial-gradient(70% 70% at 50% 50%, transparent 30%, var(--bg) 100%);
    }
    .stage > svg.map{position:absolute;inset:0;width:100%;height:100%;z-index:2}
    #vizFill{fill:var(--pink);fill-opacity:0;stroke:none}
    #vizBase{fill:none;stroke:rgba(255,255,255,0.14);stroke-width:2;stroke-linejoin:round}
    #vizDraw{
      fill:none;stroke:var(--pink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;
      filter:drop-shadow(0 0 7px rgba(255,102,204,0.7));
    }
    #vizDot{fill:#fff;filter:drop-shadow(0 0 9px var(--pink)) drop-shadow(0 0 3px #fff);opacity:0}
    .place{
      position:absolute; left:26px; bottom:14px; z-index:1; pointer-events:none;
      font-family:"Vogue",serif; font-size:clamp(40px,6vw,84px); letter-spacing:.05em; line-height:1;
      color:rgba(255,255,255,0.78); text-shadow:0 6px 30px rgba(0,0,0,0.7);
    }
    .place small{
      display:block; font-family:"Vogue",serif; font-size:13px; color:var(--muted);
      margin:0 0 6px 4px; text-shadow:none;
    }
    .stepper{position:absolute;right:16px;bottom:16px;z-index:4;display:flex;gap:8px}
    .stepper button{
      width:44px;height:44px;border-radius:50%;border:1px solid var(--pink-dim);
      display:grid;place-items:center;transition:all .18s ease;background:rgba(5,4,5,0.6);
    }
    .stepper button:hover:not(:disabled){background:var(--pink);color:#000;border-color:var(--pink)}
    .stepper button:disabled{opacity:.3;cursor:default}
    .stepper svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
    .msg{
      position:absolute;inset:0;z-index:5;display:none;place-items:center;text-align:center;
      padding:30px;color:var(--muted);font-size:15px;
    }
    .msg.show{display:grid}

    /* rail: the season at a glance */
    .rail-wrap{max-width:1360px;width:100%;margin:0 auto;display:flex;gap:14px;align-items:center}
    .years{display:flex;gap:6px;flex:0 0 auto}
    .years button{
      font-size:15px;font-weight:900;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
      color:var(--muted);transition:all .18s ease;
    }
    .years button.on{background:var(--pink);border-color:var(--pink);color:#000}
    .rail{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:thin;scrollbar-color:var(--pink-dim) transparent;flex:1;min-width:0}
    .chip{
      flex:0 0 auto;min-width:74px;padding:9px 12px;border-radius:10px;
      border:1px solid var(--line);background:var(--panel);text-align:left;transition:all .18s ease;
    }
    .chip b{display:block;font-size:15px}
    .chip span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .chip:hover{border-color:var(--pink-dim)}
    .chip.on{border-color:var(--pink);background:var(--pink-soft)}
    .chip.on b{color:var(--pink)}
    .chip.up span{color:var(--pink)}

    /* countdown */
    .next-bar{
      max-width:1360px;width:100%;margin:0 auto;display:none;align-items:center;justify-content:space-between;
      gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:14px;
    }
    .next-bar.show{display:flex}
    .cd{display:flex;gap:18px}
    .cd div{text-align:center;min-width:44px}
    .cd b{display:block;font-size:26px;color:#fff;font-weight:900;line-height:1}
    .cd span{font-size:11px;color:var(--muted)}

    /* ================= CALENDAR LIST ================= */
    .list-wrap{max-width:1360px;margin:30px auto 90px;padding:0 28px}
    .list-title{color:var(--pink);font-size:22px;font-weight:900;margin-bottom:6px}
    .list-sub{color:var(--muted);font-size:14px;margin-bottom:18px}
    .table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:720px}
    thead th{text-align:left;font-size:13px;color:var(--muted);font-weight:400;padding:10px 12px;border-bottom:1px solid var(--line)}
    tbody td{padding:12px;vertical-align:middle;font-size:15px;border-bottom:1px solid rgba(255,255,255,0.04)}
    tr.year-row td{padding:14px 0 0;border:0}
    .year-toggle{
      width:100%;display:flex;align-items:center;gap:14px;text-align:left;
      padding:18px 12px;border-bottom:1px solid var(--line);color:var(--pink);
      font-size:22px;font-weight:900;transition:background .18s ease;
    }
    .year-toggle:hover{background:rgba(255,102,204,0.08)}
    .year-toggle .count{font-size:13px;font-weight:400;color:var(--muted);margin-left:auto}
    .year-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .25s ease;flex:0 0 auto}
    .year-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
    tr.event-row[hidden]{display:none}
    tr.event-row{cursor:pointer;transition:background .18s ease,color .18s ease}
    tr.event-row td:first-child{border-radius:10px 0 0 10px}
    tr.event-row td:last-child{border-radius:0 10px 10px 0}
    tr.event-row.on{background:rgba(255,102,204,0.10)}
    /* hovering (or keyboard-focusing) an event paints the whole bar pink */
    tr.event-row:hover, tr.event-row:focus-visible{background:var(--pink);color:#050405;outline:none}
    tr.event-row:hover td.thumb path, tr.event-row:focus-visible td.thumb path{stroke:#050405;filter:none}
    tr.event-row:hover .badge, tr.event-row:focus-visible .badge{border-color:#050405;color:#050405}
    .badge{
      display:inline-block;margin-left:8px;font-size:11px;padding:2px 8px;border-radius:999px;
      border:1px solid var(--pink);color:var(--pink);vertical-align:middle;
    }
    td.thumb{width:110px;padding:6px 12px}
    td.thumb svg{display:block;width:84px;height:56px;overflow:visible}
    td.thumb path{fill:none;stroke:var(--pink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(255,102,204,0.55))}

    footer{text-align:center;padding:28px;color:var(--muted)}

    /* ================= RESPONSIVE ================= */
    @media (max-width:980px){
      .viz{padding:92px 16px 20px}
      .viz-main{grid-template-columns:1fr;min-height:0}
      .stage{order:-1;min-height:380px}
      .p-day{font-size:64px}
      .rail-wrap{flex-direction:column;align-items:stretch}
      .list-wrap{padding:0 14px}
    }
    @media (max-width:768px){
      .place{font-size:clamp(30px,10vw,48px);max-width:calc(100% - 110px);left:18px}
      thead th, tbody td{font-size:12px;padding:8px 6px}
      td.thumb{width:80px}
      td.thumb svg{width:60px;height:40px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
    }
  </style>

</head>
<body>
  <div class="navbar">
    <a href="index.html" class="logo"><img src="images/AC-Name2.png" alt="Aria Carmona"></a>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="gallery.html">GALLERY</a>
      <a href="calendar.html" class="active">CALENDAR</a>
      <a href="contact.html">CONTACT</a>
    </div>
  </div>

  <!-- ============ VISUALISER ============ -->
  <section class="viz" id="track-vis">
    <div class="viz-head">
      <div>
        <h1 id="heading">Calendar</h1>
        <p id="subhead">The modeling season is underway, view Aria’s schedule below.</p>
      </div>
      <div class="tabs">
        <a href="#track-vis" class="on">Map visualiser</a>
        <a href="#calendar-list">Calendar list</a>
      </div>
    </div>

    <div class="viz-main">
      <aside class="panel" id="panel" aria-live="polite">
        <div class="p-meta">
          <span id="pCount" class="a"></span>
          <span id="pStatus" class="p-status a"></span>
        </div>
        <div class="p-date a">
          <span class="p-day" id="pDay"></span>
          <span class="p-month" id="pMonth"></span>
          <span class="p-year" id="pYear"></span>
        </div>
        <div class="p-title a" id="pTitle"></div>
        <div class="p-blurb a" id="pBlurb"></div>
        <div class="stats a" id="pStats"></div>
        <div class="sched a" id="pSched"></div>
      </aside>

      <div class="stage" id="stage">
        <svg class="map" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Outline of the event location">
          <path id="vizFill" />
          <path id="vizBase" />
          <path id="vizDraw" />
          <circle id="vizDot" r="7" cx="0" cy="0" />
        </svg>
        <div class="place" id="place"></div>
        <div class="stepper">
          <button id="prev" aria-label="Previous event"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button id="next" aria-label="Next event"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="rail-wrap">
      <div class="years" id="years"></div>
      <div class="rail" id="rail"></div>
    </div>

    <div class="next-bar" id="nextBar">
      <span id="nextLabel"></span>
      <div class="cd" id="cd">
        <div><b id="cdD">00</b><span>days</span></div>
        <div><b id="cdH">00</b><span>hours</span></div>
        <div><b id="cdM">00</b><span>min</span></div>
        <div><b id="cdS">00</b><span>sec</span></div>
      </div>
    </div>
  </section>

  <!-- ============ CALENDAR LIST ============ -->
  <section class="list-wrap" id="calendar-list">
    <div class="list-title">All events</div>
    <div class="list-sub">Select a row to see it on the map.</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Date</th><th>Event</th><th>Designer / show</th><th>Location</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer>© 2026 Aria Carmona — All rights reserved</footer>

  <!-- GSAP (already used on this site) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- d3 + topojson turn the atlas data into outlines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

  <script>
  /* =====================================================================
     1. YOUR EVENTS — this is the only list you need to edit.
        date:     YYYY-MM-DD   (add  time: "12:00"  for the countdown)
        shape:    which outline to draw (see SHAPES below)
        optional: agency, blurb, schedule
     ===================================================================== */
  const EVENTS = [
    // ---- 2025 ----
    { date:"2025-03-19", title:"Dallas Fashion Week",             designer:"Bureau Fashion Week", type:"Runway",     loc:"Dallas, TX",         shape:"texas" },
    { date:"2025-05-31", title:"Miami Swim Week",                 designer:"Frisk Me Good",       type:"Runway",     loc:"Miami, FL",          shape:"florida" },
    { date:"2025-06-01", title:"Miami Swim Week Campaign Shoot",  designer:"Krissy King",         type:"Shoot",      loc:"Miami, FL",          shape:"florida" },
    { date:"2025-07-25", title:"New York Swim Week",              designer:"MLC Swimwear",        type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2025-08-25", title:"NYFW Prelude: Move The Crowd",    designer:"Barron Wise",         type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2025-09-27", title:"New York Fashion Week",           designer:"Jaylynn Rivers",      type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2025-09-28", title:"New York Fashion Week",           designer:"Punk Rock Creations", type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2025-10-31", title:"Montclair Spooky Met Gala",       designer:"Sinister",            type:"Gala",       loc:"Montclair, NJ",      shape:"new-jersey" },
    { date:"2025-12-20", title:"Marriott Winter Show",            designer:"MLC Swimwear",        type:"Runway",     loc:"New York, NY",       shape:"new-york" },

    // ---- 2026 ----
    { date:"2026-01-02", title:"Tiye Eliza Fashion Show: Tribe",  designer:"Tiye Eliza",          type:"Runway",     loc:"Los Angeles, CA",    shape:"california" },
    { date:"2026-01-02", title:"Tiye Eliza Fashion Show: Legacy", designer:"Tiye Eliza",          type:"Runway",     loc:"Los Angeles, CA",    shape:"california" },
    { date:"2026-02-07", title:"Hancock Tower Media Shoot",       designer:"JHIC",                type:"Shoot",      loc:"Chicago, IL",        shape:"illinois" },
    { date:"2026-02-09", title:"Ford Models Model Call",          designer:"Tom Ford",            type:"Model call", loc:"Chicago, IL",        shape:"illinois" },
    { date:"2026-02-14", title:"New York Fashion Week",           designer:"Mad Cats Studios",    type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2026-03-06", title:"Paris Fashion Week Model Call",   designer:"Revive",              type:"Model call", loc:"Paris, FRA",         shape:"france" },
    { date:"2026-03-16", title:"HOTW Midtown Fashion Show",       designer:"Dana Fashion Designs",type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2026-05-22", title:"Smoke The Runway",                designer:"Aria The Bawse",      type:"Runway",     loc:"Newark, NJ",         shape:"new-jersey" },
    { date:"2026-05-31", title:"Miami Swim Week",                 designer:"Luxe Style",          type:"Runway",     loc:"Miami, FL",          shape:"florida" },
    { date:"2026-06-01", title:"Miami Swim Week Campaign Shoot",  designer:"Desire Bikini",       type:"Shoot",      loc:"Miami, FL",          shape:"florida" },
    { date:"2026-08-27", title:"NYFW Prelude: Partake Show",      designer:"Comatose",            type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2026-09-09", title:"NYFW: American Dream 250",        designer:"Nicole B",            type:"Runway",     loc:"East Rutherford, NJ",shape:"new-jersey" },
    { date:"2026-09-09", title:"New York Fashion Week: Porsche-Caricom", designer:"Valda",        type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2026-09-13", title:"New York Fashion Week: Rebel World", designer:"Club Jelena",      type:"Runway",     loc:"New York, NY",       shape:"new-york" },
    { date:"2026-09-16", title:"Portugal Marketing & Media Shoot", designer:"Almost Famous",     type:"Shoot",      loc:"Lisbon, Portugal",   shape:"portugal" },
    { date:"2026-09-18", title:"Milan Fashion Week: RXR",         designer:"Tommy Hilfiger",      type:"Runway",     loc:"Milan, ITA",         shape:"italy" },
    { date:"2026-09-20", title:"Monaco Marketing & Media Shoot",  designer:"Windsor",             type:"Shoot",      loc:"Monte-Carlo, MON",   shape:"monaco" },
    { date:"2026-10-03", time:"12:00",
      title:"Austin Korth S/S27 Presentation", designer:"Austin Korth", type:"Runway", loc:"New York, NY", shape:"new-york",
      agency:"TDTD Models",
      blurb:"Aria rolls back into the US with high momentum, having opened in Milan and shot in Monaco. The 22 year old model looks to bring that momentum back to the States for the closing leg of the year.",
      schedule:[ ["Fitting","26 Sept · 13:00"], ["Rehearsal","2 Oct · 18:00"], ["Show","3 Oct · 12:00"] ] }
  ];

  /* =====================================================================
     2. OUTLINES — which state or country each shape key draws.
        src:"us"    → a US state from us-atlas (name must match exactly)
        src:"world" → a country from world-atlas
        bbox        → [west, south, east, north]; keeps only the parts of a
                      country inside this box (so France is the mainland,
                      not French Guiana).
     ===================================================================== */
  const SHAPES = {
    "new-york":   { src:"us",    name:"New York",   label:"New York",   sub:"United States", code:"NY" },
    "new-jersey": { src:"us",    name:"New Jersey", label:"New Jersey", sub:"United States", code:"NJ" },
    "florida":    { src:"us",    name:"Florida",    label:"Florida",    sub:"United States", code:"FL" },
    "illinois":   { src:"us",    name:"Illinois",   label:"Illinois",   sub:"United States", code:"IL" },
    "california": { src:"us",    name:"California", label:"California", sub:"United States", code:"CA" },
    "italy":      { src:"world", name:"Italy",      label:"Italy",      sub:"Milan",         code:"IT" },
    "france":     { src:"world", name:"France",     label:"France",     sub:"Paris", bbox:[-6,41,10,52], code:"FR" },

  /* Short city tags for the little chips under the map. Add a city here if you book a new one. */
  const CITY_TAGS = {
    "Los Angeles":"LA", "Chicago":"CHI", "New York":"NYC", "Newark":"NWK", "East Rutherford":"ERU",
    "Montclair":"MTC", "Miami":"MIA", "Dallas":"DAL", "Paris":"PAR", "Milan":"MIL",
    "Monte-Carlo":"MC", "Lisbon":"LIS"
  };

  const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";
  const US_URL    = "https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json";

  /* ===================================================================== */
  const $ = (s, el=document) => el.querySelector(s);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const SHORT  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  // --- prepare events
  const events = EVENTS.map((e, i) => {
    const [y, m, d] = e.date.split("-").map(Number);
    const [hh, mm] = (e.time || "00:00").split(":").map(Number);
    return { ...e, id:i, year:y, month:m-1, day:d,
             start:new Date(y, m-1, d, hh, mm),
             endOfDay:new Date(y, m-1, d, 23, 59, 59) };
  }).sort((a, b) => a.start - b.start || a.id - b.id);
  events.forEach((e, i) => e.id = i);

  const now = new Date();
  const isUp = e => e.endOfDay >= now;
  const upcoming = events.filter(isUp);
  const featured = upcoming[0] || events[events.length - 1];
  const years = [...new Set(events.map(e => e.year))].sort((a, b) => b - a);
  const inYear = y => events.filter(e => e.year === y);
  const fmtLong = e => `${MONTHS[e.month]} ${e.day}, ${e.year}`;
  const fmtShort = e => `${SHORT[e.month]} ${e.day}`;
  const cityOf = e => e.loc.split(",")[0].trim();
  const cityTag = e => CITY_TAGS[cityOf(e)] || cityOf(e).slice(0, 3).toUpperCase();

  const st = { year: featured.year, id: featured.id };

  /* ---------- geometry ---------- */
  const geo = { ready:false, feats:{}, failed:false };

  function clip(f, shape) {
    if (f.geometry.type !== "MultiPolygon") return f;
    let polys = f.geometry.coordinates;
    if (shape.bbox) {
      const [x0, y0, x1, y1] = shape.bbox;
      polys = polys.filter(c => {
        const [lon, lat] = d3.geoCentroid({ type:"Polygon", coordinates:c });
        return lon >= x0 && lon <= x1 && lat >= y0 && lat <= y1;
      });
    }
    if (!shape.keepSmall && polys.length > 1) {
      const areas = polys.map(c => d3.geoArea({ type:"Polygon", coordinates:c }));
      const total = areas.reduce((a, b) => a + b, 0);
      polys = polys.filter((_, i) => areas[i] >= total * 0.004);
    }
    return { type:"Feature", properties:f.properties, geometry:{ type:"MultiPolygon", coordinates:polys } };
  }

  function fixWinding(f) { // d3 wants clockwise outer rings
    if (d3.geoArea(f) <= 2 * Math.PI) return f;
    const flip = r => r.slice().reverse();
    const g = f.geometry;
    const coords = g.type === "Polygon" ? g.coordinates.map(flip) : g.coordinates.map(p => p.map(flip));
    return { ...f, geometry:{ ...g, coordinates:coords } };
  }

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.json();
  }

  async function loadGeo() {
    try {
      const [world, us] = await Promise.all([getJSON(WORLD_URL), getJSON(US_URL)]);
      const countries = topojson.feature(world, world.objects.countries).features;
      const states = topojson.feature(us, us.objects.states).features;
      for (const [key, shape] of Object.entries(SHAPES)) {
        if (shape.planar) { // flat traced outline: no atlas lookup needed
          geo.feats[key] = { type:"Feature", properties:{ planar:true },
            geometry:{ type:"Polygon", coordinates:[shape.planar.concat([shape.planar[0]])] } };
          continue;
        }
        const pool = shape.src === "us" ? states : countries;
        const f = pool.find(x => x.properties && x.properties.name === shape.name);
        if (f) geo.feats[key] = fixWinding(clip(f, shape));
      }
      geo.ready = true;
    } catch (err) {
      console.error("Outline data failed to load:", err);
      geo.failed = true;
    }
  }

  const pathCache = {};
  function outline(key, W, H, pad) {
    const id = [key, W, H, pad].join("|");
    if (id in pathCache) return pathCache[id];
    const f = geo.feats[key];
    if (!f) return (pathCache[id] = "");
    const base = f.properties && f.properties.planar ? d3.geoIdentity() : d3.geoMercator();
    const proj = base.fitExtent([[pad, pad], [W - pad, H - pad]], f);
    return (pathCache[id] = d3.geoPath(proj)(f) || "");
  }

  /* ---------- the big outline animation ---------- */
  const elDraw = $("#vizDraw"), elBase = $("#vizBase"), elFill = $("#vizFill"), elDot = $("#vizDot");
  let tl = null, loop = null;

  function stopAnim() { if (tl) tl.kill(); if (loop) loop.kill(); tl = loop = null; }

  function drawBig(key) {
    stopAnim();
    const msg = $("#msg");
    if (geo.failed) {
      msg.textContent = "The map outlines couldn't load. Check your connection and refresh the page.";
      msg.classList.add("show");
      return;
    }
    const d = geo.ready ? outline(key, 800, 600, 70) : "";
    if (!d) {
      [elDraw, elBase, elFill].forEach(p => p.setAttribute("d", ""));
      elDot.style.opacity = 0;
      if (geo.ready) { msg.textContent = "No outline set up for this location yet."; msg.classList.add("show"); }
      return;
    }
    msg.classList.remove("show");
    [elDraw, elBase, elFill].forEach(p => p.setAttribute("d", d));
    const len = elDraw.getTotalLength();
    elDraw.style.strokeDasharray = len;

    if (reduce) { elDraw.style.strokeDashoffset = 0; elFill.style.fillOpacity = 0.07; elDot.style.opacity = 0; return; }

    elDraw.style.strokeDashoffset = len;
    elFill.style.fillOpacity = 0;
    const pos = { p:0 };
    const place = p => {
      const pt = elDraw.getPointAtLength(len * p);
      elDot.setAttribute("cx", pt.x); elDot.setAttribute("cy", pt.y);
    };
    place(0);
    elDot.style.opacity = 1;

    tl = gsap.timeline();
    tl.to(elDraw, { strokeDashoffset:0, duration:2.6, ease:"power2.inOut" }, 0)
      .to(pos, { p:1, duration:2.6, ease:"power2.inOut", onUpdate:() => place(pos.p) }, 0)
      .to(elFill, { fillOpacity:0.07, duration:1.2 }, 1.6)
      .add(() => { // after the outline is drawn the dot keeps lapping it
        const lap = { p:0 };
        loop = gsap.to(lap, { p:1, duration:6, ease:"none", repeat:-1, onUpdate:() => place(lap.p) });
      });
  }

  /* ---------- details panel ---------- */
  function renderPanel(e) {
    const shape = SHAPES[e.shape] || {};
    const list = inYear(e.year);
    const up = isUp(e);
    $("#pCount").textContent = `Event ${list.indexOf(e) + 1} of ${list.length} in ${e.year}`;
    const s = $("#pStatus");
    s.textContent = up ? "Upcoming" : "Completed";
    s.classList.toggle("up", up);
    $("#pDay").textContent = e.day;
    $("#pMonth").textContent = MONTHS[e.month];
    $("#pYear").textContent = e.year;
    $("#pTitle").textContent = e.title;
    $("#pBlurb").textContent = e.blurb || "";
    $("#pBlurb").style.display = e.blurb ? "" : "none";

    const tiles = [["Type", e.type], ["Location", e.loc], ["Designer / show", e.designer]];
    if (e.agency) tiles.push(["Agency", e.agency]);
    $("#pStats").innerHTML = tiles.map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

    const sc = $("#pSched");
    if (e.schedule && e.schedule.length) {
      sc.style.display = "";
      sc.innerHTML = `<h3>Schedule</h3>` + e.schedule.map(([a, b]) => `<div class="sched-item"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("");
    } else { sc.style.display = "none"; sc.innerHTML = ""; }

    $("#place").innerHTML = `${shape.sub ? `<small>${esc(shape.sub)}</small>` : ""}${esc(shape.label || e.loc)}`;
  }

  /* ---------- rail ---------- */
  function renderYears() {
    $("#years").innerHTML = years.map(y => `<button data-y="${y}" class="${y === st.year ? "on" : ""}">${y}</button>`).join("");
  }
  function renderRail() {
    const list = inYear(st.year);
    $("#rail").innerHTML = list.map((e, i) => {
      return `<button class="chip ${e.id === st.id ? "on" : ""} ${isUp(e) ? "up" : ""}" data-id="${e.id}" aria-label="${esc(e.title)}, ${esc(fmtLong(e))}">
                <b>${String(i + 1).padStart(2, "0")} ${esc(cityTag(e))}</b><span>${fmtShort(e)}</span></button>`;
    }).join("");
    const on = $("#rail .chip.on");
    if (on) {
      const r = $("#rail");
      const target = on.offsetLeft - (r.clientWidth - on.offsetWidth) / 2;
      r.scrollTo({ left: Math.max(0, target), behavior: reduce ? "auto" : "smooth" });
    }
  }
  function renderHeading() {
    const anyUp = upcoming.length > 0;
    $("#heading").textContent = anyUp ? `Upcoming ${st.year} calendar` : `${st.year} calendar`;
  }
  function renderStepper() {
    const list = inYear(st.year), i = list.findIndex(e => e.id === st.id);
    $("#prev").disabled = i <= 0;
    $("#next").disabled = i >= list.length - 1;
  }

  /* ---------- select an event ---------- */
  function select(id, opts = {}) {
    const e = events[id];
    st.id = id; st.year = e.year;
    renderYears(); renderRail(); renderHeading(); renderStepper();
    renderPanel(e);
    if (!reduce && !opts.first) gsap.fromTo("#panel .a", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.45, stagger:0.04, clearProps:"transform" });
    drawBig(e.shape);
    document.querySelectorAll("tr.event-row").forEach(r => r.classList.toggle("on", Number(r.dataset.id) === id));
  }

  /* ---------- list with outline thumbnails ---------- */
  function renderRows() {
    const out = [];
    for (const y of years) {
      const n = inYear(y).length;
      out.push(`<tr class="year-row"><td colspan="5">
        <button class="year-toggle" type="button" data-y="${y}" aria-expanded="false" aria-controls="rows">
          <span>${y}</span><span class="count">${n} event${n === 1 ? "" : "s"}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button></td></tr>`);
      inYear(y).slice().reverse().forEach(e => {
        out.push(`<tr class="event-row" tabindex="0" data-id="${e.id}" data-year="${y}" hidden>
          <td>${esc(fmtLong(e))}</td>
          <td>${esc(e.title)}${isUp(e) ? '<span class="badge">Upcoming</span>' : ""}</td>
          <td>${esc(e.designer)}</td>
          <td>${esc(e.loc)}</td>
          <td class="thumb"><svg viewBox="0 0 96 64" aria-hidden="true"><path/></svg></td>
        </tr>`);
      });
    }
    $("#rows").innerHTML = out.join("");
  }

  /* outline thumbnails: prepared the first time a year is opened */
  const preparedYears = new Set();
  const thumbIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      drawThumb(en.target.querySelector("path"));
      thumbIO.unobserve(en.target);
    });
  }, { threshold:0.4 });

  function drawThumb(p) {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    if (reduce) { p.style.strokeDashoffset = 0; return; }
    gsap.fromTo(p, { strokeDashoffset:len }, { strokeDashoffset:0, duration:1.3, ease:"power2.inOut" });
  }

  function prepYear(y) {
    if (!geo.ready || preparedYears.has(y)) return;
    preparedYears.add(y);
    document.querySelectorAll(`tr.event-row[data-year="${y}"]`).forEach(row => {
      const e = events[Number(row.dataset.id)];
      const p = row.querySelector("td.thumb path");
      const d = outline(e.shape, 96, 64, 6);
      p.setAttribute("d", d);
      if (!d) return;
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = reduce ? 0 : len;
      thumbIO.observe(row.querySelector("td.thumb"));
      row.addEventListener("mouseenter", () => drawThumb(p));
    });
  }

  function toggleYear(btn, open) {
    const y = btn.dataset.y;
    const willOpen = open !== undefined ? open : btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", willOpen);
    document.querySelectorAll(`tr.event-row[data-year="${y}"]`).forEach(r => { r.hidden = !willOpen; });
    if (willOpen) prepYear(Number(y));
  }
  const openYears = () => [...document.querySelectorAll(".year-toggle[aria-expanded='true']")].map(b => Number(b.dataset.y));

  /* ---------- countdown ---------- */
  function startCountdown() {
    const nxt = upcoming.find(e => e.start > new Date());
    const bar = $("#nextBar");
    if (!nxt) { bar.classList.remove("show"); return; }
    bar.classList.add("show");
    $("#nextLabel").textContent = `Next up: ${nxt.title}, ${nxt.loc}`;
    const pad = n => String(n).padStart(2, "0");
    const tick = () => {
      let s = Math.max(0, Math.floor((nxt.start - new Date()) / 1000));
      const d = Math.floor(s / 86400); s -= d * 86400;
      const h = Math.floor(s / 3600);  s -= h * 3600;
      const m = Math.floor(s / 60);    s -= m * 60;
      $("#cdD").textContent = pad(d); $("#cdH").textContent = pad(h);
      $("#cdM").textContent = pad(m); $("#cdS").textContent = pad(s);
    };
    tick(); setInterval(tick, 1000);
  }

  /* ---------- wiring ---------- */
  function goToViz() { $("#track-vis").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); }

  $("#years").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-y]"); if (!b) return;
    const list = inYear(Number(b.dataset.y));
    select(list[list.length - 1].id);
  });
  $("#rail").addEventListener("click", ev => {
    const b = ev.target.closest(".chip"); if (b) select(Number(b.dataset.id));
  });
  $("#rows").addEventListener("click", ev => {
    const t = ev.target.closest(".year-toggle");
    if (t) { toggleYear(t); return; }
    const r = ev.target.closest("tr.event-row"); if (!r) return;
    select(Number(r.dataset.id)); goToViz();
  });
  $("#rows").addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const r = ev.target.closest("tr.event-row"); if (!r) return;
    ev.preventDefault(); select(Number(r.dataset.id)); goToViz();
  });
  const step = dir => {
    const list = inYear(st.year), i = list.findIndex(e => e.id === st.id), n = list[i + dir];
    if (n) select(n.id);
  };
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  document.addEventListener("keydown", ev => {
    if (ev.target.closest("input,textarea,tr.event-row")) return;
    if (ev.key === "ArrowLeft") step(-1);
    if (ev.key === "ArrowRight") step(1);
  });

  // swipe on the map (phones)
  let sx = null;
  $("#stage").addEventListener("touchstart", ev => { sx = ev.touches[0].clientX; }, { passive:true });
  $("#stage").addEventListener("touchend", ev => {
    if (sx === null) return;
    const dx = ev.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });

  // highlight the matching tab while scrolling
  const tabs = document.querySelectorAll(".tabs a");
  const tabIO = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) tabs.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id));
  }), { threshold:0.35 });
  tabIO.observe($("#track-vis"));
  tabIO.observe($("#calendar-list"));

  /* ---------- go ---------- */
  renderRows();
  renderYears(); renderRail(); renderHeading(); renderStepper(); renderPanel(featured);
  startCountdown();
  loadGeo().then(() => {
    select(featured.id, { first:true });
    openYears().forEach(prepYear);
  });
  </script>
  <script src="nav.js"></script>
</body>
</html>
