<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Aria Carmona</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, Helvetica, sans-serif;

    background: #050505;

    color: white;

}


/* =====================
   NAVBAR
===================== */

header {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    z-index: 1000;

}


.navbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 20px 60px;

    background: rgba(0,0,0,0.75);

    backdrop-filter: blur(10px);

}


.logo img {

    width: 150px;

    height: auto;

}


.nav-links {

    list-style: none;

    display: flex;

    gap: 35px;

}


.nav-links a {

    color: white;

    text-decoration: none;

    font-size: 13px;

    letter-spacing: 2px;

    transition: 0.3s ease;

}


.nav-links a:hover {

    opacity: .6;

}



/* =====================
   THANK YOU HERO
===================== */

.thankyou-page {

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    position: relative;

    background:

    linear-gradient(
        rgba(0,0,0,.7),
        rgba(0,0,0,.9)
    ),

    url("images/DHP00791.jpg");


    background-size: cover;

    background-position: center;

}


.thankyou-content {

    max-width: 700px;

    padding: 40px;

}


.thankyou-content h1 {

    font-size: 64px;

    letter-spacing: 8px;

    text-transform: uppercase;

    margin-bottom: 25px;

}


.thankyou-content p {

    color: #d0d0d0;

    font-size: 18px;

    line-height: 1.8;

    margin-bottom: 15px;

}



.cta-button {

    display: inline-block;

    margin-top: 35px;

    padding: 15px 40px;

    border: 1px solid white;

    color: white;

    text-decoration: none;

    letter-spacing: 3px;

    font-size: 13px;

    transition: .3s ease;

}


.cta-button:hover {

    background:white;

    color:black;

}



/* =====================
   FOOTER
===================== */


footer {

    position: absolute;

    bottom: 0;

    width: 100%;

    text-align: center;

    padding: 25px;

    background: rgba(0,0,0,.6);

}


footer p {

    font-size: 12px;

    letter-spacing: 2px;

    color:#aaa;

}



/* =====================
   MOBILE
===================== */

@media(max-width:900px){

    .navbar {

        padding:20px;

        flex-direction:column;

        gap:20px;

    }


    .nav-links {

        flex-wrap:wrap;

        justify-content:center;

        gap:20px;

    }


    .thankyou-content h1 {

        font-size:42px;

        letter-spacing:5px;

    }


    .thankyou-content p {

        font-size:16px;

    }

}

</style>

</head>


<body>


<header>

<li><a href="contact.html">CONTACT</a></li>

<li><a href="submit.html">SUBMIT</a></li>

</ul>


</nav>

</header>



<section class="thankyou-page">


<div class="thankyou-content">


<h1>Thank You</h1>


<p>
Your submission has been received.
</p>


<p>

</p>

RETURN HOME
</a>


</div>


</section>



<footer>

<p>

</p>

</footer>


</body>

</html>
